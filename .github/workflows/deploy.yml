name: Deploy to huyagtan.mn

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Package standalone output
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # No ssh-keyscan: its burst of 5 connections gets the VPS port forwarder to drop the next one.
          # One multiplexed connection is reused for every ssh/rsync call below.
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 5m
            ServerAliveInterval 15
          CFG
          chmod 600 ~/.ssh/config

      - name: Upload and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          T="$SSH_USER@deploy-target"
          RELEASE="/var/www/huyagtan.mn/releases/${GITHUB_SHA}"
          if ! ssh -v "$T" "mkdir -p $RELEASE" 2> ssh-debug.log; then
            grep -E 'Connecting|Connection established|Authenticat|Permission|denied|refused|closed|timed out|Offering|Server accepts' ssh-debug.log
            exit 1
          fi
          rsync -az --delete -e ssh .next/standalone/ "$T:$RELEASE/"
          ssh "$T" "
            set -e
            ln -sfn $RELEASE /var/www/huyagtan.mn/current
            sudo /usr/bin/systemctl restart huyagtan
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && echo 'App is up'
            cd /var/www/huyagtan.mn/releases && ls -1t | tail -n +4 | xargs -r rm -rf
          "
