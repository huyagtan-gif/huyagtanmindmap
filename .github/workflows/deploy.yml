name: Deploy to huyagtan.mn

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Package standalone output
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -C .next/standalone -czf app.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tgz
          retention-days: 7

  # Runs on the VPS itself (self-hosted runner, see deploy/setup-runner.sh).
  # The runner only makes outbound connections to GitHub, so no inbound SSH is needed.
  deploy:
    needs: build
    runs-on: [self-hosted, huyagtan]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Install release and restart
        run: |
          set -e
          RELEASE="/var/www/huyagtan.mn/releases/${GITHUB_SHA}"
          rm -rf "$RELEASE" && mkdir -p "$RELEASE"
          tar -xzf app.tgz -C "$RELEASE"
          ln -sfn "$RELEASE" /var/www/huyagtan.mn/current
          sudo /usr/bin/systemctl restart huyagtan
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && { echo "App is up"; break; }
            sleep 1
            [ "$i" = 15 ] && { sudo /usr/bin/journalctl -u huyagtan -n 50 --no-pager; exit 1; }
          done
          cd /var/www/huyagtan.mn/releases && ls -1t | tail -n +4 | xargs -r rm -rf
