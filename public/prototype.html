<title>Хуягтан систем</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell, left nav + main workspace; mind map canvas fills the workspace, person card slides in from the right */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EBEFF5; --ink:#152033; --muted:#5A6678; --line:#D8DEE7;
  --accent:#2257A8; --accent-soft:#E2EAF7; --gold:#A86A12; --gold-soft:#F6EBD9;
  --st-wait:#7D8796; --st-zol:#B9740B; --st-tod:#7446B3; --st-huy:#1C8456; --danger:#B4342E;
  --edge:#B9C3D1;
  --f-display:"Unbounded","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface2:#1E2733; --ink:#E5EAF1; --muted:#9AA6B6; --line:#2A3442;
  --accent:#73A1EA; --accent-soft:#1D2B42; --gold:#E2AA4E; --gold-soft:#33291A;
  --st-wait:#98A2B1; --st-zol:#E5A23A; --st-tod:#A880E6; --st-huy:#43B983; --danger:#E5675F; --edge:#3A4657; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface2:#1E2733; --ink:#E5EAF1; --muted:#9AA6B6; --line:#2A3442;
  --accent:#73A1EA; --accent-soft:#1D2B42; --gold:#E2AA4E; --gold-soft:#33291A;
  --st-wait:#98A2B1; --st-zol:#E5A23A; --st-tod:#A880E6; --st-huy:#43B983; --danger:#E5675F; --edge:#3A4657; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.demo-tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.top .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=tel],input[type=email],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.search{width:220px;max-width:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--surface2)}
nav.side a.on{background:var(--accent-soft);color:var(--accent)}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.badge{font-size:11px;font-family:var(--f-mono);background:var(--danger);color:#fff;border-radius:99px;padding:0 7px}
main{overflow:auto;position:relative;min-width:0}
.page{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px}
h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.locked{color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:4px;background:var(--surface2);padding:1px 8px;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:middle}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px}
.link{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card h3{margin:0 0 4px;font-size:14.5px}
.meta{color:var(--muted);font-size:12px}
/* map */
.mapwrap{display:flex;flex-direction:column;height:100%}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:8px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:6px 11px;border-radius:6px;font-weight:500;white-space:nowrap;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.chip.off{opacity:.45}
.canvas{flex:1;position:relative;overflow:hidden;min-height:420px;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--bg)}
.canvas>svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.canvas>svg.drag{cursor:grabbing}
.legend svg{flex:none}
.zoombox{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:4px}
.zoombox button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.legend{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 90px)}
.legend .row{gap:10px}
svg text{font-family:var(--f-body)}
.n-rect{stroke-width:1.2}
.node{cursor:pointer}
.node:hover .n-rect{stroke:var(--accent)}
.hl .n-rect{stroke:var(--accent)!important;stroke-width:3!important}
.flash .n-rect{animation:flash 1.4s ease-out 3}
@keyframes flash{0%{stroke:var(--gold);stroke-width:5}100%{stroke-width:1.2}}
@media (prefers-reduced-motion:reduce){.flash .n-rect{animation:none}}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));height:100%;align-items:start}
.kcol{background:var(--surface2);border-radius:8px;padding:10px;min-height:200px}
.kcol h4{margin:0 0 8px;display:flex;align-items:center;gap:7px;font-size:13px}
.kcol h4 .num{margin-left:auto;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.kcard[draggable=true]{cursor:grab}
.kcol.over{outline:2px dashed var(--accent)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:30;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.drawer .close{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));border:0;background:var(--surface2);border-radius:6px;width:30px;height:30px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.modalbg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;font-size:13px}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--surface)}
.form{display:grid;gap:12px;max-width:520px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:500}
.form .hint{font-weight:400;color:var(--muted);font-size:12px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.qr{image-rendering:pixelated;border:8px solid #fff;border-radius:6px;background:#fff}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  nav.side .grp{display:none}
  nav.side a{white-space:nowrap;gap:6px}
  .search{width:100%}
  .split{grid-template-columns:1fr}
  .legend{display:none}
  .kv{grid-template-columns:110px 1fr}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="16" cy="16" r="3.5" fill="var(--gold)"/><g stroke="var(--accent)" stroke-width="1.6"><line x1="16" y1="12.5" x2="16" y2="5"/><line x1="19" y1="18" x2="25" y2="22"/><line x1="13" y1="18" x2="7" y2="22"/></g><circle cx="16" cy="5" r="2" fill="var(--accent)"/><circle cx="25" cy="22" r="2" fill="var(--accent)"/><circle cx="7" cy="22" r="2" fill="var(--accent)"/></svg>Хуягтан</div>
    <span class="demo-tag">Прототип · жишээ өгөгдөл</span>
    <div class="spacer"></div>
    <label class="ctl">Өргөө <select id="urguuSel"></select></label>
    <label class="ctl">Харах эрх <select id="roleSel"></select></label>
    <input id="search" class="search" type="text" placeholder="Хүн, онгод хайх…" autocomplete="off" list="searchList">
    <datalist id="searchList"></datalist>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>

ONGOD_ROWS.forEach(([id,parent,name,era])=>ONGOD[id]={id,parent,name,era});

/* ============ PAN / ZOOM CANVAS ============ */
function makeCanvas(host){
  host.innerHTML=`<svg role="img" aria-label="Mind map"><g class="vp"></g></svg>
   <div class="zoombox"><button data-z="in" aria-label="Томруулах">+</button><button data-z="out" aria-label="Жижигрүүлэх">−</button><button data-z="fit" aria-label="Бүгдийг харах" style="font-size:12px">⤢</button></div>`;
  const svg=host.querySelector('svg'), g=host.querySelector('.vp');
  let t={x:40,y:40,k:1}, drag=null, moved=false;
  const apply=()=>g.setAttribute('transform',`translate(${t.x},${t.y}) scale(${t.k})`);
  const zoomAt=(f,cx,cy)=>{const k=Math.max(.25,Math.min(2.5,t.k*f));t.x=cx-(cx-t.x)*k/t.k;t.y=cy-(cy-t.y)*k/t.k;t.k=k;apply()};
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:t.x,ty:t.y};moved=false});
  window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;svg.classList.add('drag')}t.x=drag.tx+dx;t.y=drag.ty+dy;apply()});
  window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag')});
  svg.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  const fit=(minK=.45,mode='all')=>{const b=g.getBBox();const W=svg.clientWidth,H=svg.clientHeight;if(!b.width)return;
    let k=Math.min((W-60)/b.width,(H-60)/b.height,1.1);k=Math.max(minK,k);t.k=k;
    t.x=(W-b.width*k)/2-b.x*k; t.y=(H-b.height*k)/2-b.y*k;
    if(b.width*k>W) t.x=30-b.x*k; apply()};
  host.querySelector('.zoombox').addEventListener('click',e=>{const z=e.target.dataset.z;if(!z)return;const W=svg.clientWidth/2,H=svg.clientHeight/2;if(z==='in')zoomAt(1.25,W,H);else if(z==='out')zoomAt(.8,W,H);else fit(.2)});
  apply();
  return {svg,g,fit,getT:()=>({...t}),setT:v=>{t={...v};apply()},focus:(x,y)=>{t.x=svg.clientWidth/2-x*t.k;t.y=svg.clientHeight/2-y*t.k;apply()}};
}
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const textW = (s,fs=12.5)=>Math.min(230,s.length*fs*.58+26);

/* ============ TREE BUILDERS ============ */
function personNode(p,sub){return {id:'pn-'+p.id+'-'+Math.random().toString(36).slice(2,6),key:p.id,label:p.name,sub,kind:'person',status:p.status,pid:p.id,children:[]}}
function buildOngodTree(){
  const ps=people().filter(passFilter);
  const mk=o=>{
    const kids=ONGOD_ROWS.filter(r=>r[1]===o.id).map(r=>mk(ONGOD[r[0]]));
    const n={id:'og-'+o.id,label:o.name,kind:o.id.startsWith('o')?'ongod':'branch',children:kids};
    if(o.id.startsWith('o')){
      const holders=ps.filter(p=>p.ongods.includes(o.id));
      n.children=holders.map(p=>personNode(p,'Онгод: '+o.name));
      if(!holders.length) n.kind='empty';
    }
    return n;
  };
  const root={id:'og-root',label:URGUU.find(u=>u.id===S.urguu).name,kind:'root',children:ONGOD_ROWS.filter(r=>r[1]==='root').map(r=>mk(ONGOD[r[0]]))};
  const bucket=(id,label,filter)=>({id,label,kind:'branch',children:ps.filter(filter).map(p=>personNode(p,st(p.status).name))});
  root.children.push(bucket('og-tod','Тодлох',p=>p.status==='tod'&&!p.ongods.length));
  root.children.push(bucket('og-zol','Золгуулах жагсаалт',p=>p.status==='zol'));
  root.children.push(bucket('og-wait','Waiting list',p=>p.status==='wait'));
  return root;
}
function buildEraTree(){
  const ps=people().filter(passFilter);
  return {id:'era-root',label:'Цаг үеэр',kind:'root',children:ERAS.filter(e=>!S.era||e===S.era).map(e=>{
    const ogs=Object.values(ONGOD).filter(o=>o.id.startsWith('o')&&ongodEra(o.id)===e);
    const kids=ogs.map(o=>({id:'era-'+o.id,label:o.name,kind:'ongod',children:ps.filter(p=>p.ongods.includes(o.id)).map(p=>personNode(p,ongodPath(o.id)))})).filter(n=>n.children.length);
    if(e==='Тодорхойгүй') ps.filter(p=>!p.ongods.length).forEach(p=>kids.push(personNode(p,'Онгод тодорхойгүй')));
    return {id:'era-'+e,label:e,kind:'branch',children:kids};
  })};
}
function buildDeedesTree(){
  const ps=people().filter(passFilter);
  return {id:'dd-root',label:'Хуягласан дээдсээр',kind:'root',children:DEEDES.map(d=>({id:'dd-'+d.id,label:d.name,kind:'deedes',
    children:ps.filter(p=>p.deedes.includes(d.id)).map(p=>personNode(p,canSee('huyagDate')?'Хуяг: '+(p.huyagDate||'—'):'Хуягласан'))})).concat([
    {id:'dd-none',label:'Хуяглаагүй',kind:'branch',children:ps.filter(p=>!p.deedes.length).map(p=>personNode(p,st(p.status).name))}])};
}

/* ============ TREE RENDER ============ */
function renderTree(host,root){
  const cv=makeCanvas(host); const g=cv.g;
  const COL=250, ROW=34;
  let leaf=0, all=[];
  const coll=S.collapsed;
  (function lay(n,d){n.depth=d;all.push(n);const kids=coll[n.id]?[]:n.children;
    if(!kids.length){n.y=leaf++*ROW}else{kids.forEach(k=>lay(k,d+1));n.y=(kids[0].y+kids[kids.length-1].y)/2}
    n.x=d*COL; n.w=textW(n.label)+(n.children.length&&n.kind!=='person'?24:0)})(root,0);
  const edges=el('g',{},g), nodes=el('g',{},g);
  all.forEach(n=>{const kids=coll[n.id]?[]:n.children;kids.forEach(k=>{
    const x1=n.x+n.w,y1=n.y,x2=k.x,y2=k.y,mx=(x1+x2)/2;
    el('path',{d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,fill:'none',stroke:k.kind==='person'?st(k.status).color:'var(--edge)','stroke-width':k.kind==='person'?1.6:1.3,'stroke-opacity':k.kind==='person'?.7:1},edges)})});
  const q=($('#search').value||'').trim().toLowerCase();
  all.forEach(n=>{
    const gg=el('g',{class:'node',transform:`translate(${n.x},${n.y})`,tabindex:0},nodes);
    const h=n.kind==='root'?34:26;
    let fill='var(--surface)',stroke='var(--line)',dash='',fg='var(--ink)',fw=500;
    if(n.kind==='root'){fill='var(--accent)';stroke='var(--accent)';fg='var(--surface)';fw=600}
    else if(n.kind==='branch'){fill='var(--surface2)';fw=600}
    else if(n.kind==='deedes'){fill='var(--gold-soft)';stroke='var(--gold)';fw=600}
    else if(n.kind==='empty'){dash='4 3';fg='var(--muted)'}
    else if(n.kind==='person'){stroke=st(n.status).color}
    el('rect',{class:'n-rect',x:0,y:-h/2,width:n.w,height:h,rx:n.kind==='person'?13:5,fill,stroke,'stroke-dasharray':dash},gg);
    let tx=10;
    if(n.kind==='person'){el('circle',{cx:13,cy:0,r:4.5,fill:st(n.status).color},gg);tx=23}
    const t=el('text',{x:tx,y:4,'font-size':n.kind==='root'?13.5:12.5,fill:fg,'font-weight':fw},gg);
    t.textContent=n.label.length>30?n.label.slice(0,29)+'…':n.label;
    if(n.kind==='empty'){const s=el('text',{x:n.w+6,y:4,'font-size':10.5,fill:'var(--muted)'},gg);s.textContent='сул суудал'}
    if(n.children.length&&n.kind!=='person'){
      const c=coll[n.id];
      el('circle',{cx:n.w-12,cy:0,r:8,fill:c?'var(--accent)':'var(--surface)',stroke:'var(--accent)'},gg);
      const s=el('text',{x:n.w-12,y:3.5,'font-size':c?9:11,'text-anchor':'middle',fill:c?'var(--surface)':'var(--accent)','font-weight':700},gg);
      s.textContent=c?countPersons(n):'−';
    }
    if(n.kind==='person'&&q&&n.label.toLowerCase().includes(q))gg.classList.add('hl');
    if(n.kind==='ongod'&&q&&n.label.toLowerCase().includes(q))gg.classList.add('hl');
    if(n.pid&&S.flash===n.pid)gg.classList.add('flash');
    gg.addEventListener('click',()=>{if(n.kind==='person')openPerson(n.pid);else if(n.children.length){coll[n.id]=!coll[n.id];renderMap(true)}});
    gg.addEventListener('keydown',e=>{if(e.key==='Enter')gg.dispatchEvent(new Event('click'))});
  });
  return cv;
}
function countPersons(n){return n.kind==='person'?1:n.children.reduce((a,c)=>a+countPersons(c),0)}

/* ============ NETWORK (force) ============ */
function renderNetwork(host){
  const cv=makeCanvas(host), g=cv.g;
  const ps=people().filter(passFilter); const ids=new Set(ps.map(p=>p.id));
  const E=[]; const TYPES={teacher:{n:'Багш → шавь',c:'var(--accent)',dash:''},intro:{n:'Танилцуулсан',c:'var(--gold)',dash:'5 4'},tush:{n:'Түшиж хуягласан',c:'var(--st-huy)',dash:'2 3'}};
  ps.forEach(p=>['teacher','intro','tush'].forEach(k=>{if(p[k]&&ids.has(p[k]))E.push({a:p[k],b:p.id,k})}));
  const N=ps.map((p,i)=>({id:p.id,p,x:Math.cos(i/ps.length*6.283)*260,y:Math.sin(i/ps.length*6.283)*260,vx:0,vy:0}));
  const M=Object.fromEntries(N.map(n=>[n.id,n]));
  for(let it=0;it<400;it++){
    const a=1-it/400;
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const u=N[i],v=N[j];let dx=u.x-v.x,dy=u.y-v.y,d2=dx*dx+dy*dy+.01,f=14000/d2;const d=Math.sqrt(d2);dx/=d;dy/=d;u.vx+=dx*f;u.vy+=dy*f;v.vx-=dx*f;v.vy-=dy*f}
    E.forEach(e=>{const u=M[e.a],v=M[e.b];const dx=v.x-u.x,dy=v.y-u.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-120)*.02;u.vx+=dx/d*f*d*.05;u.vy+=dy/d*f*d*.05;v.vx-=dx/d*f*d*.05;v.vy-=dy/d*f*d*.05});
    N.forEach(n=>{n.vx-=n.x*.004;n.vy-=n.y*.004;n.x+=Math.max(-20,Math.min(20,n.vx))*a;n.y+=Math.max(-20,Math.min(20,n.vy))*a;n.vx*=.5;n.vy*=.5});
  }
  const defs=el('defs',{},g);
  Object.entries(TYPES).forEach(([k,t])=>{const m=el('marker',{id:'ar-'+k,viewBox:'0 0 10 10',refX:24,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',fill:t.c},m)});
  E.forEach(e=>{const u=M[e.a],v=M[e.b],t=TYPES[e.k];el('line',{x1:u.x,y1:u.y,x2:v.x,y2:v.y,stroke:t.c,'stroke-width':1.6,'stroke-dasharray':t.dash,'marker-end':`url(#ar-${e.k})`,'stroke-opacity':.85},g)});
  const q=($('#search').value||'').trim().toLowerCase();
  N.forEach(n=>{const deg=E.filter(e=>e.a===n.id).length;const r=10+Math.min(deg,6)*2.2;
    const gg=el('g',{class:'node',transform:`translate(${n.x},${n.y})`,tabindex:0},g);
    el('circle',{class:'n-rect',r,fill:'var(--surface)',stroke:st(n.p.status).color,'stroke-width':3},gg);
    el('circle',{r:4,fill:st(n.p.status).color},gg);
    const t=el('text',{y:r+14,'text-anchor':'middle','font-size':12,fill:'var(--ink)','font-weight':500,'paint-order':'stroke',stroke:'var(--bg)','stroke-width':4},gg);t.textContent=n.p.name;
    if(q&&n.p.name.toLowerCase().includes(q))gg.classList.add('hl');
    gg.addEventListener('click',()=>openPerson(n.id));
  });
  host.insertAdjacentHTML('beforeend',`<div class="legend"><strong>Холбоос</strong>${Object.values(TYPES).map(t=>`<div class="row"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="${t.c}" stroke-width="2" stroke-dasharray="${t.dash}"/></svg>${t.n}</div>`).join('')}<div class="meta">Тойргийн хэмжээ = шавь/танилцуулсан хүний тоо</div></div>`);
  return cv;
}

/* ============ EGO (one person in center) ============ */
function renderEgo(host){
  const cv=makeCanvas(host), g=cv.g;
  const ps=people(); if(!PEOPLE[S.center]||!PEOPLE[S.center].urguu.includes(S.urguu))S.center=ps[0].id;
  const c=PEOPLE[S.center];
  const groups=[
    {n:'Онгод',items:c.ongods.map(o=>({label:ONGOD[o].name,sub:ongodPath(o),kind:'ongod'})),col:'var(--edge)'},
    {n:'Хуягласан дээдэс',items:c.deedes.map(d=>({label:DEEDES.find(x=>x.id===d).name,kind:'deedes'})),col:'var(--gold)'},
    {n:'Багш',items:c.teacher?[{pid:c.teacher}]:[],col:'var(--accent)'},
    {n:'Шавь нар',items:ps.filter(p=>p.teacher===c.id).map(p=>({pid:p.id})),col:'var(--accent)'},
    {n:'Танилцуулсан хүн',items:c.intro?[{pid:c.intro}]:[],col:'var(--gold)'},
    {n:'Энэ хүний танилцуулсан',items:ps.filter(p=>p.intro===c.id).map(p=>({pid:p.id})),col:'var(--gold)'},
    {n:'Түшсэн хүн',items:c.tush?[{pid:c.tush}]:[],col:'var(--st-huy)'},
    {n:'Үйл, сургалт',items:EVENTS.filter(e=>e.parts.some(x=>x[0]===c.id)).map(e=>({label:e.name,kind:'event',go:'#events-'+e.id})).concat(TRAININGS.filter(t=>t.parts.some(x=>x.p===c.id)||t.teachers.includes(c.id)).map(t=>({label:t.name,kind:'event',go:'#trainings-'+t.id}))),col:'var(--muted)'},
  ].filter(x=>x.items.length);
  const R1=190, total=groups.length;
  groups.forEach((grp,gi)=>{
    const ang=-Math.PI/2+gi/total*Math.PI*2;
    const gx=Math.cos(ang)*R1, gy=Math.sin(ang)*R1;
    el('line',{x1:0,y1:0,x2:gx,y2:gy,stroke:grp.col,'stroke-width':2},g);
    const gl=el('g',{transform:`translate(${gx},${gy})`},g);
    const w=textW(grp.n,11.5);
    el('rect',{x:-w/2,y:-11,width:w,height:22,rx:11,fill:'var(--surface2)',stroke:grp.col},gl);
    const tt=el('text',{y:4,'text-anchor':'middle','font-size':11.5,'font-weight':600,fill:'var(--ink)'},gl);tt.textContent=grp.n;
    const n=grp.items.length, spread=Math.min(Math.PI*.95,n*.34);
    grp.items.forEach((it,ii)=>{
      const a2=ang+(n>1?(ii/(n-1)-.5)*spread:0);
      const R2=R1+130+(ii%2)*60;
      const x=Math.cos(a2)*R2,y=Math.sin(a2)*R2;
      el('line',{x1:gx,y1:gy,x2:x,y2:y,stroke:grp.col,'stroke-opacity':.6},g);
      const label=it.pid?pname(it.pid):it.label;
      const nw=textW(label,12);
      const ig=el('g',{class:'node',transform:`translate(${x},${y})`},g);
      const stc=it.pid?st(PEOPLE[it.pid].status).color:(it.kind==='deedes'?'var(--gold)':'var(--line)');
      el('rect',{class:'n-rect',x:-nw/2,y:-13,width:nw,height:26,rx:it.pid?13:5,fill:it.kind==='deedes'?'var(--gold-soft)':'var(--surface)',stroke:stc},ig);
      const t=el('text',{y:4,'text-anchor':'middle','font-size':12,fill:'var(--ink)','font-weight':500},ig);t.textContent=label.length>28?label.slice(0,27)+'…':label;
      if(it.pid)ig.addEventListener('click',()=>{S.center=it.pid;renderMap()});
      else if(it.go)ig.addEventListener('click',()=>location.hash=it.go);
    });
  });
  const cg=el('g',{class:'node'},g);
  const cw=textW(c.name,14)+20;
  el('rect',{class:'n-rect',x:-cw/2,y:-24,width:cw,height:48,rx:24,fill:'var(--accent)',stroke:st(c.status).color,'stroke-width':4},cg);
  const t=el('text',{y:-2,'text-anchor':'middle','font-size':14,'font-weight':600,fill:'var(--surface)'},cg);t.textContent=c.name;
  const t2=el('text',{y:14,'text-anchor':'middle','font-size':11,fill:'var(--surface)','fill-opacity':.85},cg);t2.textContent=st(c.status).name;
  cg.addEventListener('click',()=>openPerson(c.id));
  return cv;
}

function fakeQR(seed,size=25){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{s=(s*1103515245+12345)>>>0;return s/4294967296};x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#111';
  for(let i=0;i<size;i++)for(let j=0;j<size;j++)if(rnd()>.52)x.fillRect(i,j,1,1);
  [[0,0],[size-7,0],[0,size-7]].forEach(([a,b])=>{x.fillStyle='#fff';x.fillRect(a,b,7,7);x.fillStyle='#111';x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#111';x.fillRect(a+2,b+2,3,3)});
  return `<img class="qr" src="${c.toDataURL()}" width="150" height="150" alt="Жишээ QR код">`}

  $('#layer').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-label="QPay төлбөр"><h1 style="font-size:16px">${esc(title)}</h1>

   <div><h2>Эрхийн түвшин</h2><p class="meta">Дээрээс доош эрх буурна.</p>${listEditor(S.roles,'roles','Шинэ түвшин')}</div>
  </div>
  <h2>Талбарын харах эрх</h2><p class="meta">Аль талбарыг аль түвшин харахыг энд сонгоно. Хүний карт, хүснэгтэд шууд нөлөөлнө.</p>
  <div class="tablewrap"><table class="matrix"><thead><tr><th>Талбар</th>${S.roles.map(r=>`<th>${esc(r.name)}</th>`).join('')}</tr></thead><tbody>
  ${S.fields.map((f,i)=>`<tr><td>${esc(f.name)}</td>${S.roles.map(r=>`<td><input type="checkbox" data-f="${i}" data-r="${r.id}" ${f.roles.includes(r.id)?'checked':''} ${r.id==='super'?'disabled':''} aria-label="${esc(f.name)} · ${esc(r.name)}"></td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <h2>Өргөө хоорондын харах эрх</h2><div class="card"><div class="row" style="justify-content:space-between"><span>Тэнгэрийн өргөө → манай mind map-ийг харах</span><select><option>Хаалттай</option><option>Онгодын мод л</option><option>Бүх харагдац</option></select></div></div></div>`;
  const M=$('#main');
  const pal=['var(--accent)','var(--gold)','var(--danger)','var(--st-tod)'];
  M.querySelectorAll('[data-up],[data-down],[data-del]').forEach(b=>b.onclick=()=>{const a=S[b.dataset.k];
    if(b.dataset.up){const i=+b.dataset.up;[a[i-1],a[i]]=[a[i],a[i-1]]}
    else if(b.dataset.down){const i=+b.dataset.down;[a[i+1],a[i]]=[a[i],a[i+1]]}
    else{const i=+b.dataset.del;if(b.dataset.k==='statuses'&&Object.values(PEOPLE).some(p=>p.status===a[i].id))return toast('Энэ төлөвт хүн байгаа тул эхлээд шилжүүлнэ үү.');if(b.dataset.k==='roles'&&a[i].id===S.role)return toast('Одоо харж буй эрхээ хасах боломжгүй.');a.splice(i,1)}
    renderTop();renderSettings()});
  M.querySelectorAll('form[data-add]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;const k=f.dataset.add;
    if(k==='statuses')S.statuses.push({id:'s'+Date.now(),name:v,color:pal[S.statuses.length%pal.length]});else{const id='r'+Date.now();S.roles.push({id,name:v});S.fields.forEach(x=>{if(['knowledge','huyagDate'].includes(x.id))x.roles.push(id)})}
    renderTop();renderSettings();toast('Нэмэгдлээ.')});
  M.querySelectorAll('.matrix input').forEach(c=>c.onchange=()=>{const f=S.fields[c.dataset.f];if(c.checked)f.roles.push(c.dataset.r);else f.roles=f.roles.filter(r=>r!==c.dataset.r)});
}

/* ============ URGUUS (super admin) ============ */
function renderUrguus(){
  $('#main').innerHTML=`<div class="page"><h1>Өргөөнүүд</h1><p class="sub">Зөвхөн платформын супер админ өргөө үүсгэж, админ томилно.</p>
  <div class="tablewrap"><table><thead><tr><th>Өргөө</th><th>Гишүүд</th><th>Админ</th><th>Үүсгэсэн</th></tr></thead><tbody>
  ${URGUU.map(u=>`<tr><td>${esc(u.name)}</td><td class="num">${Object.values(PEOPLE).filter(p=>p.urguu.includes(u.id)).length}</td><td>${esc(u.admins)}</td><td class="num">${u.created}</td></tr>`).join('')}</tbody></table></div>
  <form class="row" style="margin-top:12px" id="nu"><input type="text" placeholder="Шинэ өргөөний нэр" required><input type="email" placeholder="Админы имэйл"><button class="btn pri">Өргөө үүсгэх</button></form>
  <p class="meta">Шинэ өргөө үүсэхэд эрхийн түвшин, төлөв, талбарын эрх анхдагч загвараас хуулагдана. Онгодын үндсэн мод нийтлэг.</p></div>`;
  $('#nu').onsubmit=e=>{e.preventDefault();const n=e.target.querySelector('input').value.trim();URGUU.push({id:'u'+Date.now(),name:n,created:'2026-11-24',admins:'Урилга илгээсэн'});renderTop();renderUrguus();toast('Өргөө үүслээ.')};
}

/* ============ ROUTER ============ */
function render(){
  $('#layer').innerHTML='';
  const [r,id]=(location.hash||'#map').slice(1).split('-');
  const page=PAGES.find(p=>p.id===r);
  if(!page||(page.admin&&!isAdmin())||(page.superOnly&&S.role!=='super')){if(location.hash!=='#map'){location.hash='#map';return}}
  renderNav();
  ({map:renderMapPage,people:renderPeople,events:()=>renderEvents(id),trainings:()=>renderTrainings(id),me:renderMe,register:renderRegister,approvals:renderApprovals,settings:renderSettings,urguus:renderUrguus}[page?page.id:'map']||renderMapPage)();
}
$('#urguuSel').onchange=e=>{S.urguu=e.target.value;S.collapsed={};renderTop();render()};
$('#roleSel').onchange=e=>{S.role=e.target.value;renderTop();render();toast('Одоо '+roleName(S.role)+' эрхээр харж байна.')};
$('#search').addEventListener('change',e=>{const v=e.target.value.trim();const p=people().find(x=>x.name===v);if(p){if(route()==='map'&&S.view==='ego'){S.center=p.id;renderMap()}else openPerson(p.id)}if(route()==='map')renderMap(true)});
$('#search').addEventListener('input',()=>{if(route()==='map'&&S.view!=='kanban')renderMap(true)});
window.addEventListener('hashchange',render);
renderTop(); render();
</script>
